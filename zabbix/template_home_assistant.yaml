# Zabbix 7.0+ template for publishing Home Assistant states to Zabbix.
# Import in Zabbix under Data collection -> Templates -> Import, then link it to
# the host configured in the integration (Configure -> Publish to Zabbix).
# Item keys are the same as those of Home Assistant's built-in Zabbix
# integration, so the host keeps its existing items and history.
zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
  templates:
    - uuid: 533f35c9caac409188e7ea97976e62c6
      template: 'Home Assistant'
      name: 'Home Assistant'
      description: |
        Receives Home Assistant state changes sent by the ha-zabbix integration
        (https://github.com/nkcx/ha-zabbix) through the Zabbix trapper protocol.
        Items are created by low-level discovery, one per entity (and per numeric
        attribute).
      vendor:
        name: ha-zabbix
        version: 7.0-0
      groups:
        - name: Templates/Applications
      discovery_rules:
        - uuid: 8583c9e2d3f84f16a138bfeb5c4a3978
          name: 'Numeric states discovery'
          type: TRAP
          key: homeassistant.floats_discovery
          description: 'Numeric states and numeric attributes of Home Assistant entities.'
          item_prototypes:
            - uuid: af66808ad4404660a50318021fdaf735
              name: '{#KEY}'
              type: TRAP
              key: 'homeassistant.float[{#KEY}]'
              history: 1095d
              trends: '0'
              value_type: FLOAT
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - '14400'
              tags:
                - tag: component
                  value: homeassistant
        - uuid: d4e38bbab70646cda4a5a8a3293a2cc2
          name: 'Text states discovery'
          type: TRAP
          key: homeassistant.strings_discovery
          description: 'Non-numeric states, when "Publish non-numeric states" is on.'
          item_prototypes:
            - uuid: da58c276694e4fb6aeb13e3365a8f71a
              name: '{#KEY}'
              type: TRAP
              key: 'homeassistant.string[{#KEY}]'
              history: 90d
              value_type: TEXT
              preprocessing:
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - '14400'
              tags:
                - tag: component
                  value: homeassistant
